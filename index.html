<!DOCTYPE html>
<html lang="fr">

<!--
  =============================================================================
  index.html — Coquille principale du site ESE'IA
  =============================================================================

  Ce fichier est le seul fichier HTML chargé directement par le navigateur.
  Il contient uniquement la structure permanente (header, conteneur de pages)
  et les liens vers les ressources CSS/JS.

  Le contenu de chaque page est chargé dynamiquement dans #page-container
  par js/router.js via fetch() sur les fichiers dans /pages/.

  Structure :
    ├── <head>          Métadonnées, polices, feuilles de style
    ├── <body>
    │   ├── Décors de fond (grille + halos)
    │   ├── <header>    Navigation principale (fixe, persistante)
    │   └── <main>      #page-container (contenu injecté dynamiquement)
    └── <script>        Un seul script : js/main.js (type="module")

  =============================================================================
-->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
        content="ESE'IA — Comprendre l'intelligence artificielle à travers des démonstrations et activités pratiques. Produit par l'école d'ingénieur ESEO.">

  <title>ESE'IA</title>

  <!-- ── Favicons ─────────────────────────────────────────────────────────── -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
  <link rel="manifest" href="assets/favicon/site.webmanifest">

  <!-- ── Polices Google Fonts ─────────────────────────────────────────────── -->
  <!--
    Orbitron  : titres, éléments HUD, valeurs numériques
    Exo 2     : corps de texte, boutons, labels
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Exo+2:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <!-- ── Icônes Tabler ────────────────────────────────────────────────────── -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/tabler-icons.min.css"
  >

  <!-- ── Feuilles de style (ordre important) ──────────────────────────────── -->
  <!--
    1. base.css        Variables CSS, reset, typographie, utilitaires
    2. layout.css      Header, navigation, structure des pages, footer
    3. components.css  Cartes, badges, boutons, formulaires, hero, guide
    4. demo.css        Upload, preview, résultats, loader (pages démo)
    5. quiz.css        Slides, boutons-réponses, précision (page activité)
    6. animations.css  Keyframes globaux, classes d'animation
  -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/demo.css">
  <link rel="stylesheet" href="css/quiz.css">
  <link rel="stylesheet" href="css/animations.css">

</head> 

<body>

  <!-- ── Décors de fond (fixes, derrière tout le contenu) ─────────────────── -->
  <!--
    Ces éléments sont purement décoratifs.
    .bg-grid    : grille de lignes subtiles (effet terminal)
    .bg-glow-tl : halo cyan en haut à gauche
    .bg-glow-br : halo magenta en bas à droite
    Définis dans css/layout.css
  -->
  <div class="bg-glow-tl" aria-hidden="true"></div>
  <div class="bg-glow-br" aria-hidden="true"></div>


  <!-- ══════════════════════════════════════════════════════════════════════
       HEADER — Navigation principale
       Persistant sur toutes les pages.
       Se masque lors d'un scroll vers le bas (géré par js/tabs.js).
       ══════════════════════════════════════════════════════════════════════ -->
  <header class="site-header" id="site-header">

    <!-- Logo (renvoie à la page d'accueil) -->
    <a class="header-logo" href="#propos" aria-label="ESE'IA — Retour à l'accueil">
      <img src="assets/logo/logo_site_sans_fond.png" id="loading-logo" alt="Logo ESE'IA">
    </a>

    <!-- Navigation principale -->
    <!--
      data-page : identifiant de la page à charger (clé dans PAGES de router.js)
      La classe is-active est ajoutée/retirée dynamiquement par router.js
    -->
    <nav class="main-nav" aria-label="Navigation principale">
      <button class="main-nav__btn" data-page="propos">
        À propos
      </button>
      <button class="main-nav__btn" data-page="info">
        Qu'est-ce que l'IA ?
      </button>
      <button class="main-nav__btn" data-page="demo">
        Démonstrations
      </button>
      <button class="main-nav__btn" data-page="activite">
        Activités
      </button>
    </nav>

    <!-- Bouton de basculement de thème -->
    <!-- L'icône est mise à jour dynamiquement par js/themes.js -->
    <button id="theme-toggle" class="theme-toggle-btn" aria-label="Passer au thème sombre">
      <i class="ti ti-moon"></i>
    </button>

  </header>
  <!-- /site-header -->


  <!-- ══════════════════════════════════════════════════════════════════════
       CONTENU PRINCIPAL
       Le HTML de chaque page est injecté ici par js/router.js.
       Ne rien ajouter dans ce conteneur : son contenu est entièrement géré
       par le routeur.
       ══════════════════════════════════════════════════════════════════════ -->
  <main id="page-container" aria-live="polite" aria-label="Contenu principal">
    <!--
      Contenu chargé dynamiquement depuis /pages/ :
        pages/propos.html
        pages/info.html
        pages/demo.html
        pages/activite.html
    -->
  </main>


  <!-- ── Script principal ─────────────────────────────────────────────────── -->
  <!--
    Un seul point d'entrée JS, en module ES6.
    Il importe router.js et tabs.js, qui eux-mêmes importent demo.js et quiz.js.
    Aucun script inline n'est autorisé dans ce projet.
  -->
  <script type="module" src="js/main.js"></script>

</body>
</html>
